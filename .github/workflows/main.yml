name: Snapshot SSC before retirement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and hash current SSC files
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          entries = json.loads(Path('.github/ssc-snapshot-inputs.json').read_text())
          target = Path('snapshot')
          target.mkdir()
          snapshots = []
          for entry in entries:
              destination = target / Path(entry['output']).name
              subprocess.run(['curl', '--fail', '--show-error', '--silent', '--location',
                              '--retry', '3', '--retry-all-errors', '--connect-timeout', '15',
                              '--max-time', '60', entry['origin'], '--output', str(destination)], check=True)
              data = destination.read_bytes()
              if not data:
                  raise ValueError('Empty response: ' + entry['origin'])
              snapshots.append({
                  'output': entry['output'], 'source': entry['source'],
                  'archive': 'snapshots/ssc/' + destination.name,
                  'original_url': entry['origin'],
                  'fetched_at': datetime.now(timezone.utc).isoformat(),
                  'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data),
                  'behavior': entry['behavior'],
              })
              print('Saved', destination.name, len(data), 'bytes', flush=True)
          (target / 'manifest.json').write_text(json.dumps({'snapshots': snapshots}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-current-snapshot
          path: snapshot/
          if-no-files-found: error
          retention-days: 30
