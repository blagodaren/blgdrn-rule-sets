name: Build and mirror rule sets

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh external mirrors (static sources always stay local)
        type: boolean
        default: true
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - 'sources.json'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'rule-providers*.yaml'
      - '.github/workflows/main.yml'
  pull_request:
    paths:
      - 'sources/**'
      - 'sources.json'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'ruleset/**'
      - 'rule-providers*.yaml'
      - '.github/workflows/main.yml'

concurrency:
  group: rulesets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and pinned Mihomo
        run: |
          python -m pip install -r requirements.txt
          python scripts/install_mihomo.py
      - name: Test the build safeguards
        run: python -m unittest discover -s tests -v
      - name: Build static sources and optionally refresh mirrors
        env:
          REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) }}
        run: |
          args=()
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          python scripts/manage_rules.py build --mihomo .tools/mihomo "${args[@]}"
          python scripts/manage_rules.py validate --mihomo .tools/mihomo
      - name: Publish compiled outputs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add ruleset/
          if git diff --cached --quiet; then
            echo 'All outputs are already up to date.'
            exit 0
          fi
          git commit -m "Build rule sets $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # Concurrent human commits cause a safe non-fast-forward failure.
          # Their push starts another build from the new sources.
          git push origin HEAD:main
